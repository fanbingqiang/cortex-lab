server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/cortex2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&characterSetResults=UTF-8&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:asdfghjkl123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

cortex:
  llm:
    default-config:
      api-key: ${LLM_API_KEY:your-api-key-here}
      base-url: https://api.deepseek.com
      model: deepseek-chat
